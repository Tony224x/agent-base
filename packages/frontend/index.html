<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Chat — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    agent-chat {
      width: 100%;
      max-width: 720px;
      height: 80vh;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 4px 6px -1px rgba(0,0,0,.07),
        0 12px 24px -4px rgba(0,0,0,.1);
    }
  </style>
</head>
<body>
  <agent-chat
    api-url="http://localhost:8000"
    agent-id="default"
    theme="light"
  ></agent-chat>

  <script type="module" src="/src/agent-chat.ts"></script>
</body>
</html>
